<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TRACKRAT — 2026 INVITATIONAL</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fugaz+One&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --orange: #FF4D1F;
      --black: #000000;
      --white: #FFFFFF;
    }

    html, body { height: 100%; }

    body {
      font-family: 'IBM Plex Mono', monospace;
      background: var(--orange);
      color: var(--black);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a {
      text-decoration: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    a:hover { opacity: 0.6; transition: opacity 0.2s ease; }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 40px;
      font-size: 13px;
      letter-spacing: 0.05em;
    }

    nav .nav-left {
      font-family: 'Fugaz One', cursive;
      font-size: 18px;
      letter-spacing: -0.14em;
      position: absolute;
      left: 40px;
    }

    nav .nav-center {
      display: flex;
      gap: 28px;
      font-weight: 500;
    }

    .page {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px;
    }

    .subtitle {
      font-size: clamp(24px, 4vw, 48px);
      font-family: 'Fugaz One', cursive;
      line-height: 1;
      margin-bottom: 8px;
    }

    .year {
      font-size: clamp(80px, 18vw, 240px);
      font-family: 'Fugaz One', cursive;
      letter-spacing: -0.14em;
      line-height: 0.85;
      margin-bottom: 24px;
      padding-right: 0.14em;
    }

    .coming {
      font-size: clamp(12px, 1.4vw, 16px);
      letter-spacing: 0.3em;
      margin-top: 40px;
      opacity: 0.4;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      nav { padding: 20px 24px; justify-content: flex-start; }
      nav .nav-left { position: static; margin-right: 16px; }
      nav .nav-center { gap: 12px; font-size: 9px; white-space: nowrap; }
    }
  </style>
</head>

<body>

  <nav>
    <a href="/" class="nav-left">TRACKRAT</a>
    <div class="nav-center">
      <a href="https://shop.trackratsprint.club" target="_blank">[ SHOP ]</a>
      <a href="/brand">[ BRAND ]</a>
      <a href="/schedule">[ SCHEDULE ]</a>
      <a href="/2026-invitational">[ 2026 INVITATIONAL ]</a>
    </div>
  </nav>

  <div class="page">
    <div class="subtitle"><span style="letter-spacing: -0.14em;">TRACKRAT</span> <span style="letter-spacing: -0.10em;">INVITATIONAL</span></div>
    <div class="year">2026</div>
    <div class="coming">DETAILS COMING SOON</div>
  </div>

</body>
</html>
