<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TRACKRAT</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fugaz+One&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --orange: #FF4D1F;
      --black: #000000;
      --white: #FFFFFF;
    }
    html, body { height: 100%; }
    body {
      font-family: 'IBM Plex Mono', monospace;
      background: var(--orange);
      color: var(--black);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    a {
      text-decoration: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    a:hover { opacity: 0.6; transition: opacity 0.2s ease; }
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 40px;
      font-size: 13px;
      letter-spacing: 0.05em;
    }
    nav .nav-left {
      font-family: 'Fugaz One', cursive;
      font-size: 18px;
      letter-spacing: -0.14em;
      position: absolute;
      left: 40px;
    }
    nav .nav-center {
      display: flex;
      gap: 28px;
      font-weight: 500;
    }

    /* ---- MOBILE MENU TOGGLE ---- */
    .menu-toggle {
      display: none;
      position: relative;
      width: 32px;
      height: 32px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      z-index: 200;
      color: var(--black);
    }

    .menu-toggle span {
      position: absolute;
      left: 4px;
      right: 4px;
      height: 2px;
      background: currentColor;
      transition: transform 0.3s ease, opacity 0.2s ease, top 0.3s ease;
    }

    .menu-toggle span:nth-child(1) { top: 10px; }
    .menu-toggle span:nth-child(2) { top: 16px; }
    .menu-toggle span:nth-child(3) { top: 22px; }

    .menu-toggle.is-open {
      color: var(--white);
    }

    .menu-toggle.is-open span:nth-child(1) {
      top: 16px;
      transform: rotate(45deg);
    }
    .menu-toggle.is-open span:nth-child(2) { opacity: 0; }
    .menu-toggle.is-open span:nth-child(3) {
      top: 16px;
      transform: rotate(-45deg);
    }

    /* ---- MOBILE MENU OVERLAY ---- */
    .mobile-menu {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 150;
      background: var(--black);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 80px 32px 60px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .mobile-menu.is-open {
      display: flex;
      opacity: 1;
    }

    .mobile-menu a {
      font-size: clamp(32px, 8vw, 44px);
      font-family: 'Fugaz One', cursive;
      letter-spacing: -0.04em;
      color: var(--white);
      padding: 14px 0;
      width: 100%;
      transform: translateX(-20px);
      opacity: 0;
      transition: transform 0.4s ease, opacity 0.4s ease, color 0.2s ease;
    }

    .mobile-menu.is-open a {
      transform: translateX(0);
      opacity: 1;
    }

    .mobile-menu.is-open a:nth-child(1) { transition-delay: 0.05s; }
    .mobile-menu.is-open a:nth-child(2) { transition-delay: 0.12s; }
    .mobile-menu.is-open a:nth-child(3) { transition-delay: 0.19s; }
    .mobile-menu.is-open a:nth-child(4) { transition-delay: 0.26s; }

    .mobile-menu a:hover,
    .mobile-menu a:active {
      color: var(--orange);
    }

    .mobile-menu-footer {
      position: absolute;
      bottom: 40px;
      left: 32px;
      right: 32px;
      font-size: 10px;
      letter-spacing: 0.3em;
      opacity: 0.3;
      font-weight: 600;
      color: var(--white);
    }

    .page {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px;
    }

    .subtitle {
      font-size: clamp(80px, 18vw, 240px);
      font-family: 'Fugaz One', cursive;
      letter-spacing: -0.14em;
      line-height: 0.85;
      margin-bottom: 24px;
      padding-right: 0.14em;
    }
    .coming {
      font-size: clamp(12px, 1.4vw, 16px);
      letter-spacing: 0.3em;
      margin-top: 40px;
      opacity: 0.4;
      font-weight: 600;
    }
    @media (max-width: 768px) {
      nav {
        padding: 16px 20px;
        justify-content: space-between;
      }
      nav .nav-left {
        position: static;
        font-size: 16px;
        flex-shrink: 0;
      }
      nav .nav-center {
        display: none;
      }
      .menu-toggle {
        display: block;
      }
    }
    @media (max-width: 420px) {
      nav .nav-left { font-size: 14px; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-left">TRACKRAT</a>
    <div class="nav-center">
      <a href="https://shop.trackratsprint.club" target="_blank">[ SHOP ]</a>
      <a href="/schedule">[ SCHEDULE ]</a>
      <a href="/brand">[ BRAND ]</a>
      <a href="/2026-invitational">[ 2026 INVITATIONAL ]</a>
    </div>
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <!-- MOBILE MENU OVERLAY -->
  <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
    <a href="https://shop.trackratsprint.club" target="_blank">SHOP</a>
    <a href="/schedule">SCHEDULE</a>
    <a href="/brand">BRAND</a>
    <a href="/2026-invitational">2026 INVITATIONAL</a>
    <div class="mobile-menu-footer">TRACKRAT SPRINT CLUB</div>
  </div>

  <div class="page">
    <div class="subtitle">TRACKRAT</div>
    <div class="coming">SPRINT CLUB > RUN CLUB</div>
  </div>

  <script>
    const menuToggle = document.getElementById('menuToggle');
    const mobileMenu = document.getElementById('mobileMenu');

    function closeMenu() {
      menuToggle.classList.remove('is-open');
      mobileMenu.classList.remove('is-open');
      menuToggle.setAttribute('aria-expanded', 'false');
      mobileMenu.setAttribute('aria-hidden', 'true');
    }

    function openMenu() {
      menuToggle.classList.add('is-open');
      mobileMenu.classList.add('is-open');
      menuToggle.setAttribute('aria-expanded', 'true');
      mobileMenu.setAttribute('aria-hidden', 'false');
    }

    menuToggle.addEventListener('click', () => {
      if (menuToggle.classList.contains('is-open')) {
        closeMenu();
      } else {
        openMenu();
      }
    });

    mobileMenu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', closeMenu);
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && menuToggle.classList.contains('is-open')) {
        closeMenu();
      }
    });
  </script>
</body>
</html>
